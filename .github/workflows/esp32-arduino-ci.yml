name: ESP32 Arduino Build

on:
  push:
    paths-ignore:
      - "RC_FlightController/build/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-arduino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE_VERSION: "3.3.8"
  ESP32_PACKAGE_INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  # Exact established release configuration for the generic ESP32 Dev Module
  # carrying the ESP32-WROOM-32E used by this flight controller.
  FQBN: "esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default"
  EXPECTED_BOARD_NAME: "ESP32 Dev Module"
  SKETCH_PATH: "RC_FlightController"
  BUILD_INFO_HEADER: "RC_FlightController/FirmwareBuildInfo.h"
  RELEASE_BUILD_PATH: ".ci-build/release"
  DEBUG_BUILD_PATH: ".ci-build/debug"
  PUBLISH_PATH: "RC_FlightController/build"

jobs:
  compile:
    name: Compile ESP32 Dev Module firmware
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure ESP32 board package
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls "${ESP32_PACKAGE_INDEX}"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          arduino-cli core list

      - name: Verify exact ESP32 board and partition definition
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli board details --fqbn "${FQBN}" | tee board-details.txt
          grep -Fq "${EXPECTED_BOARD_NAME}" board-details.txt
          grep -Fq "PartitionScheme=min_spiffs" board-details.txt
          grep -Fq "FlashSize=4M" board-details.txt
          grep -Fq "PSRAM=disabled" board-details.txt

      - name: Verify sketch and submodules
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SKETCH_PATH}/RC_FlightController.ino"
          test -f "${BUILD_INFO_HEADER}"
          git submodule status --recursive | tee submodules.txt

      - name: Generate firmware build identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' "${BUILD_INFO_HEADER}" | head -n 1)
          if [ -z "${version}" ]; then
            echo "Unable to read FW_VERSION from ${BUILD_INFO_HEADER}" >&2
            exit 1
          fi

          source_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_branch="${source_branch//\//-}"
          short_sha="${GITHUB_SHA:0:12}"
          build_compact=$(date -u +%Y%m%dT%H%M%SZ)
          build_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > "${BUILD_INFO_HEADER}" <<EOF
          #pragma once

          // Generated by .github/workflows/esp32-arduino-ci.yml before compilation.
          #define FW_NAME "RC_FlightController"
          #define FW_VERSION "${version}"
          #define FW_SOURCE_BRANCH "${source_branch}"
          #define FW_SOURCE_COMMIT "${short_sha}"
          #define FW_SOURCE_DIRTY 0
          #define FW_BUILD_ID "${build_compact}-${safe_branch}-${short_sha}"
          #define FW_BUILD_TIME_ISO "${build_iso}"
          EOF

          cat "${BUILD_INFO_HEADER}"

      - name: Compile release firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RELEASE_BUILD_PATH}"
          mkdir -p "${RELEASE_BUILD_PATH}"
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --warnings all \
            --jobs 0 \
            --build-property "compiler.cpp.extra_flags=-DVERBOSE_ON=0" \
            --output-dir "${RELEASE_BUILD_PATH}" \
            "${SKETCH_PATH}" 2>&1 | tee compile-release.txt

      - name: Compile debug firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DEBUG_BUILD_PATH}"
          mkdir -p "${DEBUG_BUILD_PATH}"
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --warnings all \
            --jobs 0 \
            --build-property "compiler.cpp.extra_flags=-DVERBOSE_ON=1" \
            --output-dir "${DEBUG_BUILD_PATH}" \
            "${SKETCH_PATH}" 2>&1 | tee compile-debug.txt

      - name: Prepare repository firmware bundle and metrics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PUBLISH_PATH}"
          mkdir -p "${PUBLISH_PATH}/bin_release" "${PUBLISH_PATH}/bin_debug"

          find "${RELEASE_BUILD_PATH}" -maxdepth 1 -type f -name '*.bin' \
            -exec cp '{}' "${PUBLISH_PATH}/bin_release/" ';'
          find "${DEBUG_BUILD_PATH}" -maxdepth 1 -type f -name '*.bin' \
            -exec cp '{}' "${PUBLISH_PATH}/bin_debug/" ';'

          for variant in bin_release bin_debug; do
            count=$(find "${PUBLISH_PATH}/${variant}" -maxdepth 1 -type f -name '*.bin' | wc -l)
            if [ "${count}" -lt 4 ]; then
              echo "Expected at least four .bin files in ${variant}; found ${count}." >&2
              exit 1
            fi
          done

          # Stable root-level release mirrors used by the existing OTA workflow.
          cp "${PUBLISH_PATH}/bin_release/RC_FlightController.ino.bin" "${PUBLISH_PATH}/"
          cp "${PUBLISH_PATH}/bin_release/RC_FlightController.ino.merged.bin" "${PUBLISH_PATH}/"

          cp compile-release.txt "${PUBLISH_PATH}/compile-release.txt"
          cp compile-debug.txt "${PUBLISH_PATH}/compile-debug.txt"
          cp board-details.txt "${PUBLISH_PATH}/board-details.txt"
          cp submodules.txt "${PUBLISH_PATH}/submodules.txt"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          publish = pathlib.Path(os.environ["PUBLISH_PATH"])
          header = pathlib.Path(os.environ["BUILD_INFO_HEADER"])

          def read_text(path):
              return pathlib.Path(path).read_text(encoding="utf-8", errors="replace")

          def parse_int(value):
              return int(value.replace(",", "")) if value is not None else None

          def parse_usage(log_path):
              text = read_text(log_path)
              flash = re.search(
                  r"Sketch uses ([\d,]+) bytes \(([\d.]+)%\) of program storage space\. "
                  r"Maximum is ([\d,]+) bytes\.",
                  text,
              )
              ram = re.search(
                  r"Global variables use ([\d,]+) bytes \(([\d.]+)%\) of dynamic memory, "
                  r"leaving ([\d,]+) bytes for local variables\. Maximum is ([\d,]+) bytes\.",
                  text,
              )
              if not flash or not ram:
                  raise RuntimeError(f"Unable to parse resource metrics from {log_path}")
              flash_used = parse_int(flash.group(1))
              flash_max = parse_int(flash.group(3))
              return {
                  "flash_used_bytes": flash_used,
                  "flash_used_percent": float(flash.group(2)),
                  "flash_max_bytes": flash_max,
                  "flash_free_bytes": flash_max - flash_used,
                  "ram_global_bytes": parse_int(ram.group(1)),
                  "ram_used_percent": float(ram.group(2)),
                  "ram_remaining_bytes": parse_int(ram.group(3)),
                  "ram_max_bytes": parse_int(ram.group(4)),
              }

          def macro(name):
              match = re.search(
                  rf'^#define\s+{re.escape(name)}\s+"?([^"\n]+)"?$',
                  read_text(header),
                  flags=re.MULTILINE,
              )
              return match.group(1) if match else None

          artifacts = []
          for file_path in sorted(publish.rglob("*.bin")):
              data = file_path.read_bytes()
              rel = file_path.relative_to(publish).as_posix()
              if rel.startswith("bin_release/"):
                  variant = "release"
              elif rel.startswith("bin_debug/"):
                  variant = "debug"
              else:
                  variant = "release_mirror"
              artifacts.append(
                  {
                      "file": rel,
                      "variant": variant,
                      "size_bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "application_image": file_path.name.endswith(".ino.bin"),
                      "merged_flash_image": file_path.name.endswith(".merged.bin"),
                  }
              )

          metrics = {
              "schema_version": 2,
              "build": {
                  "status": "success",
                  "generated_utc": datetime.now(timezone.utc).isoformat(),
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "source_branch": os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME"),
                  "source_commit": os.environ.get("GITHUB_SHA"),
                  "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "workflow_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
                  "workflow_run_url": (
                      f"{os.environ.get('GITHUB_SERVER_URL')}/"
                      f"{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/"
                      f"{os.environ.get('GITHUB_RUN_ID')}"
                  ),
              },
              "firmware_identity": {
                  "name": macro("FW_NAME"),
                  "version": macro("FW_VERSION"),
                  "source_branch": macro("FW_SOURCE_BRANCH"),
                  "source_commit": macro("FW_SOURCE_COMMIT"),
                  "build_id": macro("FW_BUILD_ID"),
                  "build_time_iso": macro("FW_BUILD_TIME_ISO"),
              },
              "target": {
                  "board_name": os.environ["EXPECTED_BOARD_NAME"],
                  "fqbn": os.environ["FQBN"],
                  "arduino_cli_version": os.environ["ARDUINO_CLI_VERSION"],
                  "esp32_core_version": os.environ["ESP32_CORE_VERSION"],
                  "flash_size": "4M",
                  "flash_mode": "qio",
                  "flash_frequency_mhz": 80,
                  "cpu_frequency_mhz": 240,
                  "partition_scheme": "min_spiffs",
                  "psram": "disabled",
                  "loop_core": 1,
                  "events_core": 1,
              },
              "variants": {
                  "release": {
                      "verbose_on": 0,
                      "resource_usage": parse_usage("compile-release.txt"),
                  },
                  "debug": {
                      "verbose_on": 1,
                      "resource_usage": parse_usage("compile-debug.txt"),
                  },
              },
              "artifacts": artifacts,
              "total_published_binary_bytes": sum(item["size_bytes"] for item in artifacts),
          }

          (publish / "build-metrics.json").write_text(
              json.dumps(metrics, indent=2) + "\n", encoding="utf-8"
          )

          with (publish / "SHA256SUMS.txt").open("w", encoding="utf-8") as sums:
              for artifact in artifacts:
                  sums.write(f"{artifact['sha256']}  {artifact['file']}\n")

          release = metrics["variants"]["release"]["resource_usage"]
          debug = metrics["variants"]["debug"]["resource_usage"]
          identity = metrics["firmware_identity"]
          markdown = f"""# RC_FlightController Build Metrics

          Generated: `{metrics['build']['generated_utc']}`  
          Source commit: `{metrics['build']['source_commit']}`  
          Firmware: `{identity['name']} {identity['version']}`  
          Build ID: `{identity['build_id']}`  
          Board: `{metrics['target']['board_name']}`  
          Partition scheme: `min_spiffs` on 4 MB flash

          | Variant | Flash used | Flash max | Flash % | RAM globals | RAM max | RAM % | RAM remaining |
          |---|---:|---:|---:|---:|---:|---:|---:|
          | Release | {release['flash_used_bytes']:,} | {release['flash_max_bytes']:,} | {release['flash_used_percent']:.1f}% | {release['ram_global_bytes']:,} | {release['ram_max_bytes']:,} | {release['ram_used_percent']:.1f}% | {release['ram_remaining_bytes']:,} |
          | Debug | {debug['flash_used_bytes']:,} | {debug['flash_max_bytes']:,} | {debug['flash_used_percent']:.1f}% | {debug['ram_global_bytes']:,} | {debug['ram_max_bytes']:,} | {debug['ram_used_percent']:.1f}% | {debug['ram_remaining_bytes']:,} |

          See `build-metrics.json` for machine-readable details and `SHA256SUMS.txt` for binary integrity checks.
          """
          (publish / "BUILD_METRICS.md").write_text(
              "\n".join(line.strip() for line in markdown.splitlines()) + "\n",
              encoding="utf-8",
          )
          PY

          echo "Generated repository bundle:"
          find "${PUBLISH_PATH}" -type f -printf '%P\t%s bytes\n' | sort
          cat "${PUBLISH_PATH}/BUILD_METRICS.md"

      - name: Upload compiled firmware and metrics
        uses: actions/upload-artifact@v7
        with:
          name: esp32-flight-controller-${{ github.sha }}
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit firmware bundle and identity to source branch
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Arch/V4')
        shell: bash
        run: |
          set -euo pipefail

          publish_branch="${GITHUB_REF_NAME}"
          remote_sha=$(git ls-remote origin "refs/heads/${publish_branch}" | cut -f1)
          if [ "${remote_sha}" != "${GITHUB_SHA}" ]; then
            echo "${publish_branch} advanced during this build; skipping stale firmware publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${PUBLISH_PATH}" "${BUILD_INFO_HEADER}"

          if git diff --cached --quiet; then
            echo "Firmware bundle is unchanged; nothing to commit."
            exit 0
          fi

          short_sha="${GITHUB_SHA:0:12}"
          git commit -m "ci: publish ESP32 release and debug firmware for ${short_sha} [skip ci]"
          git push origin "HEAD:${publish_branch}"
